name: ${COMPOSE_PROJECT_NAME:-taas-local}

services:
  typebot-db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TYPEBOT_POSTGRES_DB}
      POSTGRES_USER: ${TYPEBOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TYPEBOT_POSTGRES_PASSWORD}
    volumes:
      - typebot_db_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  typebot-builder:
    image: baptistearno/typebot-builder:${TYPEBOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
    environment:
      NEXTAUTH_SECRET: ${TYPEBOT_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${TYPEBOT_NEXTAUTH_URL}
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_NEXT_PUBLIC_VIEWER_URL}
      DATABASE_URL: postgresql://${TYPEBOT_POSTGRES_USER}:${TYPEBOT_POSTGRES_PASSWORD}@${TYPEBOT_POSTGRES_HOST}:${TYPEBOT_POSTGRES_PORT}/${TYPEBOT_POSTGRES_DB}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET}
      ADMIN_EMAIL: ${TYPEBOT_ADMIN_EMAIL}
      GITHUB_CLIENT_ID: ${TYPEBOT_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${TYPEBOT_GITHUB_CLIENT_SECRET}
      NODE_OPTIONS: ${TYPEBOT_NODE_OPTIONS:---no-node-snapshot}
    ports:
      - "${TYPEBOT_BUILDER_PORT:-8080}:3000"

  typebot-viewer:
    image: baptistearno/typebot-viewer:${TYPEBOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${TYPEBOT_POSTGRES_USER}:${TYPEBOT_POSTGRES_PASSWORD}@${TYPEBOT_POSTGRES_HOST}:${TYPEBOT_POSTGRES_PORT}/${TYPEBOT_POSTGRES_DB}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${TYPEBOT_NEXTAUTH_URL}
      NEXT_PUBLIC_VIEWER_URL: ${TYPEBOT_NEXT_PUBLIC_VIEWER_URL}
      NODE_OPTIONS: ${TYPEBOT_NODE_OPTIONS:---no-node-snapshot}
    ports:
      - "${TYPEBOT_VIEWER_PORT:-8081}:3000"

  chatwoot-db:
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHATWOOT_POSTGRES_DB}
      POSTGRES_USER: ${CHATWOOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
    volumes:
      - chatwoot_db_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatwoot-redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
    volumes:
      - chatwoot_redis_local:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatwoot:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: ${CHATWOOT_RAILS_ENV:-production}
      NODE_ENV: ${CHATWOOT_NODE_ENV:-production}
      INSTALLATION_ENV: ${CHATWOOT_INSTALLATION_ENV:-docker}
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      POSTGRES_HOST: ${CHATWOOT_POSTGRES_HOST}
      POSTGRES_PORT: ${CHATWOOT_POSTGRES_PORT}
      POSTGRES_DATABASE: ${CHATWOOT_POSTGRES_DB}
      POSTGRES_USERNAME: ${CHATWOOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@${CHATWOOT_REDIS_HOST}:${CHATWOOT_REDIS_PORT}
      ACTIVE_STORAGE_SERVICE: ${CHATWOOT_STORAGE_SERVICE:-local}
      SMTP_ADDRESS: ${MAILPIT_HOST}
      SMTP_PORT: ${MAILPIT_SMTP_PORT}
      SMTP_AUTHENTICATION: ${MAILPIT_SMTP_AUTH:-none}
    volumes:
      - chatwoot_storage_local:/app/storage
    ports:
      - "${CHATWOOT_BIND_IP:-127.0.0.1}:${CHATWOOT_PORT:-3000}:3000"

  chatwoot-worker:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: ${CHATWOOT_RAILS_ENV:-production}
      NODE_ENV: ${CHATWOOT_NODE_ENV:-production}
      INSTALLATION_ENV: ${CHATWOOT_INSTALLATION_ENV:-docker}
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      POSTGRES_HOST: ${CHATWOOT_POSTGRES_HOST}
      POSTGRES_PORT: ${CHATWOOT_POSTGRES_PORT}
      POSTGRES_DATABASE: ${CHATWOOT_POSTGRES_DB}
      POSTGRES_USERNAME: ${CHATWOOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@${CHATWOOT_REDIS_HOST}:${CHATWOOT_REDIS_PORT}
      ACTIVE_STORAGE_SERVICE: ${CHATWOOT_STORAGE_SERVICE:-local}
    volumes:
      - chatwoot_storage_local:/app/storage

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND_IP:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  typebot_db_local:
  chatwoot_db_local:
  chatwoot_redis_local:
  chatwoot_storage_local: